<div id="auth-page" class="auth-page">
    {{# if verified}}
        <h1>You're all set to vote!</h1>
        <p><a href="/vote/ballot" data-internal="true">Vote now</a>.</p>

        <button id="unverify-button" class="button button-primary">Un-verify me</button>
    {{else}}

    <h1>Register to vote today!</h1>
    
    <span class="secondary-emphasis">To vote in the 2026 cycle, please confirm the following:</span>

    <ul class="voter-attestation-list">
        <li>
            <input type="checkbox"/>
            <label>I live in the City of Boston</label>
        </li>
        <li>
            <input type="checkbox"/>
            <label>I am at least 11 years old or in the 6th grade</label>
        </li>
        <li>
            <input type="checkbox"/>
            <label>I have not voted in this year's IIA cycle</label>
        </li>
    </ul>

    <span class="secondary-emphasis">Type in your name to continue:</span>

    <input type="text" id="voter-name-input" placeholder="First and Last Name" />

    <button id="verify-button" class="button button-primary">Verify me</button>

    <p>Not eligible to vote but still curious about the ballots? Return to <a href="/vote/ballot" data-internal="true">ballot</a></p>

    {{/if}}
</div>
