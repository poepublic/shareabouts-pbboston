<div id="faq-page" class="faq-page">
    <h1 class="bigger-text">Frequently asked questions</h1>
    <br>
    {{#each faqs.sections}}
    <div class = "faq-section">
        <h1 class="faq-title">{{title}}</h1>
        {{#each questions}}
        <div class = "faq-question">
            <h2 class="question">{{question}}</h2>
            <p class="answer">{{answer}}</p>
        </div>
        {{/each}}
    </div>
    {{/each}}
    <p>Ready to get started? Read this year's <a href="/vote/ballot" data-internal="true">ballot</a></p>

</div>
