<div id="ballot-page" class="ballot-page">
    <h1>This year, your neighbors created <span class = "bigger-text">15 proposals</span> to benefit Boston.</h1>
    <span class="secondary-emphasis">Read about them below then <a href="/vote/auth" data-internal="true">vote</a> by 3/1/2027.
    For more information about this process, see <a href="/vote/faq" data-internal="true">FAQs</a></span>
    {{# ballot.proposals }}
    <div class="proposal-container">
      <h3 class="proposal-title">{{title}}</h3>
      <p class="proposal-cost">Estimated cost: {{amount}}</p>
      <p class="proposal-description">{{description}}</p>
      <img class="proposal-image" src="{{image}}" alt="{{title}}">
    </div>
    {{/ ballot.proposals }}
    <a id = "ballot-banner" href="/vote/auth" data-internal="true">Register to vote today!</a>
</div>
