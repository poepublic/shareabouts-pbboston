<div id="ballot-page" class="ballot-page">
  <h1>This year, your <img class="inline-scribble" src="/static/img/iia/Scribble_Wavey_04_Pink.svg"><span class="bigger-text">neighbors</span> came up with <span class="scribble-text scribble-text-pink bigger-text">15 projects</span> to <img class="inline-scribble" src="/static/img/iia/Scribble_Arrow_02_Pink.svg" alt=""><span class="bigger-text">Benefit Boston</span></h1>
  
  <span>Read them below and <a href="/vote/auth" data-internal="true">vote</a> by 3/1/2027.</span>
  
  <p>For more information about this process, see <a href="/vote/faq" data-internal="true">FAQs</a></p>
  <div class="proposal-container">
    {{# ballot.proposals }}
        <div class="proposal-card">
          <div class="proposal-card-top">
            <h3 class="proposal-title"><span><input type="checkbox" class="proposal-checkbox" value="{{slug}}"></span> {{title}}</h3>
          </div>
          <span class="proposal-cost">{{currency amount}}</span>
          <span class="proposal-description">{{description}}</span>
          <img class="proposal-image" src="{{image}}" alt="{{title}}">
        </div>
    {{/ ballot.proposals }}
  </div>
    <a id = "ballot-banner" href="/vote/auth" data-internal="true">Register to vote today!</a>
</div>
