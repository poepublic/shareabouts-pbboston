<div id="ballot-page" class="ballot-page">
  <h1 class="ballot-page-header">{{#_}}This year, your <img class="inline-scribble" src="/static/img/iia/Scribble_Wavey_04_Pink.svg"><span class="bigger-text">neighbors</span> came up with <span class="scribble-text scribble-text-pink bigger-text">15 projects</span> to <img class="inline-scribble" src="/static/img/iia/Scribble_Arrow_02_Pink.svg" alt=""><span class="bigger-text">Benefit Boston</span>{{/_}}</h1>

  <span>{{#_}}Read them below and <a href="/vote/auth" data-internal="true">vote</a> by 2/15/2027.{{/_}}</span>

  <p>{{#_}}For more information about this process, see <a href="/vote/faq" data-internal="true">FAQs</a>{{/_}}</p>
  <div class="proposal-container">
    {{#each (randomize ballot.proposals)}}
    {{#if ../verified}}
    {{else}}
    {{/if}}
        <label for="checkbox-{{slug}}">
          <div class="proposal-card" id="proposal-card-{{slug}}">
            <div class="proposal-card-top">
              {{#if ../verified}}
              <h3 class="proposal-title">
                <span class = "proposal-card-top-left"><input type="checkbox" id="checkbox-{{slug}}" class="proposal-checkbox" value="{{title}}" data-amount="{{currency amount}}" data-slug="{{slug}}"></span>
                {{title}}
              </h3>
              {{else}}
              <h3 class="proposal-title">
                <span class = "proposal-card-top-left"><input type="checkbox" id="checkbox-{{slug}}" class="proposal-checkbox" disabled></span>
                {{title}}
              </h3>
              {{/if}}

            </div>
            <span class="proposal-cost">{{currency amount}}</span>
            <span class="proposal-description">{{description}}</span>
            <img class="proposal-image" src="{{image}}" alt="{{title}}">
          </div>
        </label>
      </span>

    {{/each}}
  </div>
  <div class="ballot-banner-container"></div>
</div>
