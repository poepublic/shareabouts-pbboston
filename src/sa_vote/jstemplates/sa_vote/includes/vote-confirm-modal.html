<div id="vote-confirm-overlay" class="vote-confirm-overlay">
  <div id="vote-confirm-modal" class="vote-confirm-modal">
    <img src="/static/img/iia/ProcessIcon_01_Black.svg">
    <h2 class="vote-confirm-message">{{#_}}Your selections:{{/_}}</h2>
    <ul class="vote-confirm-list">
      {{#each proposals}}
      <li>{{title}}</li>
      {{/each}}
    </ul>
    <h2 class="vote-confirm-message">{{#_}}Ready to vote?{{/_}}</h2>
    <button class="btn btn-primary" id="vote-confirm-submit">{{#_}}Confirm{{/_}}</button>
    <button id="vote-confirm-cancel" type="button">{{#_}}Take me back to the ballot{{/_}}</button>
  </div>
</div>
