<li class="selected-proposal" data-title="{{title}}" data-slug="{{slug}}">
    <a class="selected-proposal-info" data-slug="{{slug}}">
        <span class="selected-proposal-title">{{title}}</span>
        <span class="selected-proposal-amount">{{amount}}</span>
    </a>
    <button class="selected-proposal-remove" aria-label="{{#_}}Remove {{title}}{{/_}}" data-slug="{{slug}}"></button>
</li>
