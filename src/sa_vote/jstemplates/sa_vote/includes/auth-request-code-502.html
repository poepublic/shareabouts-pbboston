<div class="dialog-header yield-icon-header">
    <h1>{{#_}}Something went wrong{{/_}}</h1>
</div>

<div class="dialog-body">
    <p>{{#_}}Something unexpected went wrong while requesting a voter code:{{/_}}</p>
    <blockquote>{{label}}</blockquote>
    <p>{{#_}}Please try again later.{{/_}}</p>
</div>

<div class="dialog-actions">
    <button type="button" data-action="close">{{#_}}Ok{{/_}}</button>
</div>
