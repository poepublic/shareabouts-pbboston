<div class="dialog-header yield-icon-header">
    <h1>{{#_}}Phone number has been used{{/_}}</h1>
</div>

<div class="dialog-body">
    <p>{{#_}}It looks like a ballot has already been submitted for the phone number <code>{{phone_number}}</code>. If you believe this is an error, please contact the Office of Participatory Budgeting at pb@boston.gov. <a href="mailto:pb@boston.gov">Send us an email.</a>{{/_}}</p>
</div>

<div class="dialog-actions">
    <button type="button" data-action="close">{{#_}}Try another number{{/_}}</button>
</div>
